<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Dark Mode</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 240px;
      background: #111;
      color: #e0e0e6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .icon {
      width: 22px;
      height: 22px;
      background: linear-gradient(135deg, #444 40%, #888);
      border-radius: 50%;
      flex-shrink: 0;
    }

    h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #f0f0f0;
    }

    .modes {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mode-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: #1a1a1a;
      color: #b0b0b8;
      font-size: 12.5px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      width: 100%;
      text-align: left;
    }

    .mode-btn:hover {
      background: #242424;
      color: #e0e0e6;
    }

    .mode-btn.active {
      background: #222;
      border-color: #555;
      color: #f0f0f0;
    }

    .swatch {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .mode-label { flex: 1; font-weight: 500; }

    .mode-desc {
      font-size: 10.5px;
      color: #666;
      margin-top: 1px;
    }

    .mode-text { display: flex; flex-direction: column; }

    .indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: transparent;
      margin-left: auto;
    }

    .mode-btn.active .indicator {
      background: #888;
    }

    footer {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #222;
      font-size: 10px;
      color: #444;
      text-align: center;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <header>
    <div class="icon"></div>
    <h1>Smart Dark Mode</h1>
  </header>

  <div class="modes">
    <button class="mode-btn" data-mode="off">
      <div class="swatch" style="background:#f5f5f5; border-color: #ccc;"></div>
      <div class="mode-text">
        <span class="mode-label">Off</span>
        <span class="mode-desc">Original page colors</span>
      </div>
      <div class="indicator"></div>
    </button>

    <button class="mode-btn" data-mode="soft">
      <div class="swatch" style="background:#1f1f1f;"></div>
      <div class="mode-text">
        <span class="mode-label">Soft Dark</span>
        <span class="mode-desc">Warm grays · Easy on the eyes</span>
      </div>
      <div class="indicator"></div>
    </button>

    <button class="mode-btn" data-mode="deep">
      <div class="swatch" style="background:#121212;"></div>
      <div class="mode-text">
        <span class="mode-label">Deep Dark</span>
        <span class="mode-desc">Cool grays · High contrast</span>
      </div>
      <div class="indicator"></div>
    </button>

    <button class="mode-btn" data-mode="midnight">
      <div class="swatch" style="background:#000000;"></div>
      <div class="mode-text">
        <span class="mode-label">Midnight Black</span>
        <span class="mode-desc">Absolute black · OLED-ready</span>
      </div>
      <div class="indicator"></div>
    </button>
  </div>

  <footer>Preserves brand colors · No global filters</footer>

  <script src="popup.js"></script>
</body>
</html>
